services:
  web:
    build: .
    profiles: ["prod"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://varagov:${VARAGOV_DB_PASSWORD:-varagov}@postgres:5432/varagov
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build: .
    profiles: ["prod"]
    restart: unless-stopped
    command: ["npm", "run", "worker"]
    environment:
      DATABASE_URL: postgresql://varagov:${VARAGOV_DB_PASSWORD:-varagov}@postgres:5432/varagov
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  migrate:
    build: .
    profiles: ["prod"]
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://varagov:${VARAGOV_DB_PASSWORD:-varagov}@postgres:5432/varagov
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: varagov
      POSTGRES_PASSWORD: ${VARAGOV_DB_PASSWORD:-varagov}
      POSTGRES_DB: varagov
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U varagov -d varagov"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
